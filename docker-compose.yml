# LOCAL DEVELOPMENT ONLY. Production uses docker-compose.prod.yml (service "blog").
# Never run this file on the server: it starts a database and a search engine
# that production does not use. Ports are bound to loopback and secrets must come
# from .env, so even a mistaken run exposes nothing.
services:
  postgres:
    image: postgres:15-alpine
    container_name: vastucart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vastucart
      POSTGRES_PASSWORD: ${BLOG_DEV_POSTGRES_PASSWORD:?set BLOG_DEV_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vastucart_blog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vastucart -d vastucart_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: vastucart_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?set MEILISEARCH_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  meili_data:
